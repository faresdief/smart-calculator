<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>الحاسبة الذكية | Smart Calculator</title>
    <meta name="description" content="حاسبة ذكية مجانية: نسبة مئوية ذكية، وضع علمي، سجل العمليات، وضع فاتح وداكن، وتعمل بدون إنترنت. — Free smart calculator with scientific mode, history, dark/light themes and offline support.">
    <meta name="theme-color" content="#141716">
    <meta name="color-scheme" content="dark light">
    <meta name="application-name" content="الحاسبة الذكية">
    <meta property="og:type" content="website">
    <meta property="og:title" content="الحاسبة الذكية | Smart Calculator">
    <meta property="og:description" content="حاسبة ذكية بوضع علمي وسجل عمليات وتعمل بدون إنترنت.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="الحاسبة">

    <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">

    <!-- يضبط الثيم واللغة قبل أول رسم للصفحة حتى لا يحدث وميض -->
    <script>
        (function () {
            try {
                var root = document.documentElement;
                var get = function (k) { try { return localStorage.getItem('smartcalc.' + k); } catch (e) { return null; } };
                var theme = get('theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
                var lang = get('lang') === 'en' ? 'en' : 'ar'; // اللغة الافتراضية: العربية — غيّرها هنا وفي script.js (DEFAULT_LANG)
                var accent = get('accent'); // لون التمييز — غيّره من زر اللوحة في شريط الأدوات
                root.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
                if (['blue', 'amber', 'rose', 'violet'].indexOf(accent) !== -1) root.setAttribute('data-accent', accent);
                root.lang = lang;
                root.dir = lang === 'ar' ? 'rtl' : 'ltr';
            } catch (e) { /* ignore */ }
        })();
    </script>
</head>
<body>
    <main class="app">
        <h1 class="sr-only" data-i18n="title">الحاسبة الذكية</h1>

        <section class="calculator" id="calculator">
            <!-- شريط الأدوات -->
            <header class="toolbar">
                <div class="toolbar-group">
                    <button type="button" class="icon-btn" id="btn-history" aria-expanded="false" aria-controls="history-panel" data-i18n-label="history">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.8-6.5"/><path d="M3 4v5h5"/><path d="M12 7.5V12l3 2"/></svg>
                    </button>
                    <button type="button" class="icon-btn icon-btn-text" id="btn-sci" aria-pressed="false" aria-controls="sci" data-i18n-label="sci">fx</button>
                    <button type="button" class="icon-btn icon-btn-text" id="btn-angle">DEG</button>
                </div>
                <div class="toolbar-group">
                    <button type="button" class="icon-btn" id="btn-accent" aria-expanded="false" aria-controls="accent-panel" data-i18n-label="accent">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-.9 2-1.8 0-.9-.7-1.5-.7-2.4 0-1 .8-1.8 1.9-1.8H17a4 4 0 0 0 4-4c0-4.4-4-8-9-8z"/><circle cx="7.5" cy="11.5" r="1.1"/><circle cx="10.5" cy="7.5" r="1.1"/><circle cx="15" cy="7.5" r="1.1"/></svg>
                    </button>
                    <button type="button" class="icon-btn icon-btn-text" id="btn-digits" aria-pressed="false" data-i18n-label="digits">١٢٣</button>
                    <button type="button" class="icon-btn icon-btn-text" id="btn-lang">EN</button>
                    <button type="button" class="icon-btn" id="btn-sound" aria-pressed="true" data-i18n-label="sound_off">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path class="sound-wave" d="M15.5 9.2a4 4 0 0 1 0 5.6M18 7a7.4 7.4 0 0 1 0 10"/><path class="sound-mute" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
                    </button>
                    <button type="button" class="icon-btn" id="btn-theme">
                        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                    </button>
                </div>
            </header>

            <!-- شاشة العرض: سطر صغير للتعبير وسطر كبير للنتيجة -->
            <section class="display" dir="ltr">
                <button type="button" class="icon-btn copy-btn" id="btn-copy" data-i18n-label="copy">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
                </button>
                <button type="button" class="icon-btn share-btn" id="btn-share" data-i18n-label="share">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>
                </button>
                <button type="button" class="icon-btn fav-btn" id="btn-fav" aria-pressed="false" data-i18n-label="fav_add">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8 6.8 19.6l1-5.8L3.5 9.7l5.9-.9z"/></svg>
                </button>
                <span class="mem-indicator" id="mem-indicator" data-i18n-label="memory_on" hidden>M</span>
                <div class="expr" id="expr"></div>
                <output class="result" id="result" aria-live="polite" aria-atomic="true">0</output>
            </section>

            <!-- الأزرار العلمية -->
            <div class="sci" id="sci" dir="ltr" hidden>
                <button type="button" class="btn btn-sci btn-toggle" id="btn-2nd" aria-pressed="false" data-i18n-label="second">2nd</button>
                <button type="button" class="btn btn-sci" data-key="sin" data-key-inv="asin" data-label="sin" data-label-inv="sin⁻¹" data-i18n-label="sin" data-i18n-label-inv="asin">sin</button>
                <button type="button" class="btn btn-sci" data-key="cos" data-key-inv="acos" data-label="cos" data-label-inv="cos⁻¹" data-i18n-label="cos" data-i18n-label-inv="acos">cos</button>
                <button type="button" class="btn btn-sci" data-key="tan" data-key-inv="atan" data-label="tan" data-label-inv="tan⁻¹" data-i18n-label="tan" data-i18n-label-inv="atan">tan</button>
                <button type="button" class="btn btn-sci" data-key="pi" data-i18n-label="pi">π</button>

                <button type="button" class="btn btn-sci" data-key="ln" data-i18n-label="ln">ln</button>
                <button type="button" class="btn btn-sci" data-key="log" data-i18n-label="log">log</button>
                <button type="button" class="btn btn-sci" data-key="sqrt" data-i18n-label="sqrt">√</button>
                <button type="button" class="btn btn-sci" data-key="square" data-i18n-label="square">x²</button>
                <button type="button" class="btn btn-sci" data-key="^" data-i18n-label="power">x<sup>y</sup></button>

                <button type="button" class="btn btn-sci" data-key="(" data-i18n-label="lparen">(</button>
                <button type="button" class="btn btn-sci" data-key=")" data-i18n-label="rparen">)</button>
                <button type="button" class="btn btn-sci" data-key="!" data-i18n-label="fact">n!</button>
                <button type="button" class="btn btn-sci" data-key="inv" data-i18n-label="inv">1/x</button>
                <button type="button" class="btn btn-sci" data-key="e" data-i18n-label="euler">e</button>
            </div>

            <!-- أزرار الذاكرة -->
            <div class="memory" dir="ltr">
                <button type="button" class="btn btn-mem" data-mem="mem_clear" data-i18n-label="mc">MC</button>
                <button type="button" class="btn btn-mem" data-mem="mem_recall" data-i18n-label="mr">MR</button>
                <button type="button" class="btn btn-mem" data-mem="mem_sub" data-i18n-label="m_minus">M&minus;</button>
                <button type="button" class="btn btn-mem" data-mem="mem_add" data-i18n-label="m_plus">M+</button>
            </div>

            <!-- لوحة الأرقام -->
            <div class="keys buttons" dir="ltr">
                <button type="button" class="btn btn-clear" data-key="clear" data-i18n-label="clear">C</button>
                <button type="button" class="btn btn-delete" data-key="del" data-i18n-label="del">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9.5l-5 5M12 9.5l5 5"/></svg>
                </button>
                <button type="button" class="btn btn-operator" data-key="%" data-i18n-label="percent">%</button>
                <button type="button" class="btn btn-operator" data-key="/" data-i18n-label="divide">&divide;</button>

                <button type="button" class="btn" data-key="7" data-digit="7">7</button>
                <button type="button" class="btn" data-key="8" data-digit="8">8</button>
                <button type="button" class="btn" data-key="9" data-digit="9">9</button>
                <button type="button" class="btn btn-operator" data-key="*" data-i18n-label="multiply">&times;</button>

                <button type="button" class="btn" data-key="4" data-digit="4">4</button>
                <button type="button" class="btn" data-key="5" data-digit="5">5</button>
                <button type="button" class="btn" data-key="6" data-digit="6">6</button>
                <button type="button" class="btn btn-operator" data-key="-" data-i18n-label="minus">&minus;</button>

                <button type="button" class="btn" data-key="1" data-digit="1">1</button>
                <button type="button" class="btn" data-key="2" data-digit="2">2</button>
                <button type="button" class="btn" data-key="3" data-digit="3">3</button>
                <button type="button" class="btn btn-operator" data-key="+" data-i18n-label="plus">+</button>

                <button type="button" class="btn btn-operator" data-key="paren" data-i18n-label="paren">( )</button>
                <button type="button" class="btn" data-key="0" data-digit="0">0</button>
                <button type="button" class="btn" data-key="." data-digit="." data-i18n-label="decimal">.</button>
                <button type="button" class="btn btn-equal" data-key="equals" data-i18n-label="equals">=</button>
            </div>

            <details class="converter" id="converter">
                <summary data-convert-text="title">تحويل الوحدات</summary>
                <div class="converter-body">
                    <label><span data-convert-text="category">نوع التحويل</span>
                        <select id="convert-category"><option value="length" data-convert-text="length">الطول</option><option value="mass" data-convert-text="mass">الوزن</option><option value="speed" data-convert-text="speed">السرعة</option><option value="area" data-convert-text="area">المساحة</option><option value="data" data-convert-text="data">حجم البيانات</option><option value="currency" data-convert-text="currency">العملات</option></select>
                    </label>
                    <label><span data-convert-text="amount">القيمة</span><input id="convert-amount" type="text" inputmode="decimal" dir="ltr" autocomplete="off" maxlength="80"></label>
                    <div class="converter-pair">
                        <label><span data-convert-text="from">من</span><select id="convert-from"></select></label>
                        <label><span data-convert-text="to">إلى</span><select id="convert-to"></select></label>
                    </div>
                    <button type="button" class="convert-swap" id="convert-swap" data-convert-text="swap">عكس الوحدات</button>
                    <label id="convert-rate-group" hidden><span id="convert-rate-label">سعر الصرف</span><input id="convert-rate" type="text" inputmode="decimal" dir="ltr" autocomplete="off" maxlength="80" aria-describedby="convert-rate-hint"><small id="convert-rate-hint" data-convert-text="rateHint"></small></label>
                    <div id="convert-online" hidden>
                        <button type="button" class="convert-swap" id="convert-refresh">حدّث السعر</button>
                        <small id="convert-rate-status" role="status" aria-live="polite"></small>
                        <small><a id="convert-attribution" href="https://www.exchangerate-api.com" target="_blank" rel="noopener noreferrer">أسعار الصرف من ExchangeRate-API</a></small>
                    </div>
                    <output id="convert-result" aria-live="polite" aria-atomic="true"></output>
                    <small id="convert-note" hidden></small>
                </div>
            </details>

            <details class="converter" id="dates">
                <summary data-i18n="dates_title">حاسبة التواريخ</summary>
                <div class="converter-body">
                    <label><span data-i18n="dates_mode">نوع الحساب</span>
                        <select id="date-mode"><option value="diff" data-i18n="dates_diff">الفرق بين تاريخين</option><option value="add" data-i18n="dates_add">إضافة أيام لتاريخ</option><option value="sub" data-i18n="dates_sub">طرح أيام من تاريخ</option></select>
                    </label>
                    <label><span id="date-a-label">من تاريخ</span><input id="date-a" type="date" min="0001-01-01" max="9999-12-31" dir="ltr"></label>
                    <label id="date-b-group"><span data-i18n="dates_to">إلى تاريخ</span><input id="date-b" type="date" min="0001-01-01" max="9999-12-31" dir="ltr"></label>
                    <label id="date-n-group" hidden><span data-i18n="dates_days">عدد الأيام</span><input id="date-n" type="text" inputmode="numeric" dir="ltr" autocomplete="off" maxlength="9"></label>
                    <output id="date-result" aria-live="polite" aria-atomic="true"></output>
                </div>
            </details>

            <details class="converter" id="percent">
                <summary data-i18n="pct_title">حاسبة النسب</summary>
                <div class="converter-body">
                    <label><span data-i18n="pct_mode">نوع الحساب</span>
                        <select id="pct-mode"><option value="discount" data-i18n="pct_discount">خصم على سعر</option><option value="tip" data-i18n="pct_tip">إكرامية على فاتورة</option><option value="tax_add" data-i18n="pct_tax_add">إضافة ضريبة</option><option value="tax_incl" data-i18n="pct_tax_incl">استخراج الضريبة من إجمالي</option><option value="what" data-i18n="pct_what">كم نسبة رقم من رقم</option><option value="change" data-i18n="pct_change">نسبة الزيادة أو النقصان</option></select>
                    </label>
                    <label><span id="pct-a-label">السعر</span><input id="pct-a" type="text" inputmode="decimal" dir="ltr" autocomplete="off" maxlength="20"></label>
                    <label><span id="pct-b-label">نسبة الخصم %</span><input id="pct-b" type="text" inputmode="decimal" dir="ltr" autocomplete="off" maxlength="20"></label>
                    <label id="pct-n-group" hidden><span data-i18n="pct_people">عدد الأشخاص</span><input id="pct-n" type="text" inputmode="numeric" dir="ltr" autocomplete="off" maxlength="3" value="1"></label>
                    <output id="pct-result" aria-live="polite" aria-atomic="true"></output>
                </div>
            </details>

            <p class="keyboard-hint" id="keyboard-hint">⌨ 0–9 · + − * / · Enter = · Backspace ⌫ · Esc C</p>

            <!-- سجل العمليات -->
            <aside class="history" id="history-panel" role="region" data-i18n-label="history" hidden>
                <header class="history-head">
                    <h2 data-i18n="history">السجل</h2>
                    <div class="toolbar-group">
                        <button type="button" class="icon-btn" id="btn-history-export" data-i18n-label="history_export">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
                        </button>
                        <button type="button" class="icon-btn" id="btn-history-clear" data-i18n-label="history_clear">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
                        </button>
                        <button type="button" class="icon-btn" id="btn-history-close" data-i18n-label="history_close">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                        </button>
                    </div>
                </header>
                <div class="history-tabs" role="tablist">
                    <button type="button" class="history-tab" id="tab-history" role="tab" aria-selected="true" data-i18n="history">السجل</button>
                    <button type="button" class="history-tab" id="tab-favs" role="tab" aria-selected="false" data-i18n="favorites">المفضلة</button>
                </div>
                <input type="search" class="history-search" id="history-search" data-i18n-label="history_search" autocomplete="off" enterkeyhint="search" dir="auto" hidden>
                <p class="history-empty" id="history-empty" data-i18n="history_empty">لا توجد عمليات سابقة بعد.</p>
                <p class="history-empty" id="favs-empty" data-i18n="favs_empty" hidden>لا توجد نتائج مفضلة بعد. اضغط النجمة بجانب أي نتيجة لحفظها.</p>
                <p class="history-empty" id="history-nomatch" data-i18n="history_nomatch" hidden>لا توجد نتائج مطابقة.</p>
                <ol class="history-list" id="history-list"></ol>
            </aside>

            <!-- لوحة اختيار لون التمييز -->
            <div class="accent-panel" id="accent-panel" role="group" data-i18n-label="accent" hidden>
                <button type="button" class="icon-btn swatch" data-accent-choice="green" data-i18n-label="accent_green"><span class="dot dot-green" aria-hidden="true"></span></button>
                <button type="button" class="icon-btn swatch" data-accent-choice="blue" data-i18n-label="accent_blue"><span class="dot dot-blue" aria-hidden="true"></span></button>
                <button type="button" class="icon-btn swatch" data-accent-choice="amber" data-i18n-label="accent_amber"><span class="dot dot-amber" aria-hidden="true"></span></button>
                <button type="button" class="icon-btn swatch" data-accent-choice="rose" data-i18n-label="accent_rose"><span class="dot dot-rose" aria-hidden="true"></span></button>
                <button type="button" class="icon-btn swatch" data-accent-choice="violet" data-i18n-label="accent_violet"><span class="dot dot-violet" aria-hidden="true"></span></button>
            </div>

            <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </section>

        <noscript><p class="noscript">هذه الحاسبة تحتاج JavaScript لتعمل. / This calculator needs JavaScript.</p></noscript>
    </main>

    <script src="calc.js"></script>
    <script src="state.js"></script>
    <script src="script.js"></script>
</body>
</html>
