<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>الحاسبة الذكية | Smart Calculator</title>
    <meta name="description" content="حاسبة ذكية مجانية: نسبة مئوية ذكية، وضع علمي، سجل العمليات، وضع فاتح وداكن، وتعمل بدون إنترنت. — Free smart calculator with scientific mode, history, dark/light themes and offline support.">
    <meta name="theme-color" content="#0b1220">
    <meta name="color-scheme" content="dark light">
    <meta name="application-name" content="الحاسبة الذكية">
    <meta property="og:type" content="website">
    <meta property="og:title" content="الحاسبة الذكية | Smart Calculator">
    <meta property="og:description" content="حاسبة ذكية بوضع علمي وسجل عمليات وتعمل بدون إنترنت.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="الحاسبة">

    <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">

    <!-- يضبط الثيم واللغة قبل أول رسم للصفحة حتى لا يحدث وميض -->
    <script>
        (function () {
            try {
                var root = document.documentElement;
                var get = function (k) { try { return localStorage.getItem('smartcalc.' + k); } catch (e) { return null; } };
                var theme = get('theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
                var lang = get('lang') === 'en' ? 'en' : 'ar'; // اللغة الافتراضية: العربية — غيّرها هنا وفي script.js (DEFAULT_LANG)
                root.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
                root.lang = lang;
                root.dir = lang === 'ar' ? 'rtl' : 'ltr';
            } catch (e) { /* ignore */ }
        })();
    </script>
</head>
<body>
    <main class="app">
        <h1 class="sr-only" data-i18n="title">الحاسبة الذكية</h1>

        <section class="calculator" id="calculator">
            <!-- شريط الأدوات -->
            <header class="toolbar">
                <div class="toolbar-group">
                    <button type="button" class="icon-btn" id="btn-history" aria-expanded="false" aria-controls="history-panel" data-i18n-label="history">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.8-6.5"/><path d="M3 4v5h5"/><path d="M12 7.5V12l3 2"/></svg>
                    </button>
                    <button type="button" class="icon-btn icon-btn-text" id="btn-sci" aria-pressed="false" aria-controls="sci" data-i18n-label="sci">fx</button>
                    <button type="button" class="icon-btn icon-btn-text" id="btn-angle">DEG</button>
                </div>
                <div class="toolbar-group">
                    <button type="button" class="icon-btn icon-btn-text" id="btn-digits" aria-pressed="false" data-i18n-label="digits">١٢٣</button>
                    <button type="button" class="icon-btn icon-btn-text" id="btn-lang">EN</button>
                    <button type="button" class="icon-btn" id="btn-theme">
                        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                    </button>
                </div>
            </header>

            <!-- شاشة العرض: سطر صغير للتعبير وسطر كبير للنتيجة -->
            <section class="display" dir="ltr">
                <button type="button" class="icon-btn copy-btn" id="btn-copy" data-i18n-label="copy">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
                </button>
                <div class="expr" id="expr"></div>
                <output class="result" id="result" aria-live="polite" aria-atomic="true">0</output>
            </section>

            <!-- الأزرار العلمية -->
            <div class="sci" id="sci" dir="ltr" hidden>
                <button type="button" class="btn btn-sci btn-toggle" id="btn-2nd" aria-pressed="false" data-i18n-label="second">2nd</button>
                <button type="button" class="btn btn-sci" data-key="sin" data-key-inv="asin" data-label="sin" data-label-inv="sin⁻¹" data-i18n-label="sin" data-i18n-label-inv="asin">sin</button>
                <button type="button" class="btn btn-sci" data-key="cos" data-key-inv="acos" data-label="cos" data-label-inv="cos⁻¹" data-i18n-label="cos" data-i18n-label-inv="acos">cos</button>
                <button type="button" class="btn btn-sci" data-key="tan" data-key-inv="atan" data-label="tan" data-label-inv="tan⁻¹" data-i18n-label="tan" data-i18n-label-inv="atan">tan</button>
                <button type="button" class="btn btn-sci" data-key="pi" data-i18n-label="pi">π</button>

                <button type="button" class="btn btn-sci" data-key="ln" data-i18n-label="ln">ln</button>
                <button type="button" class="btn btn-sci" data-key="log" data-i18n-label="log">log</button>
                <button type="button" class="btn btn-sci" data-key="sqrt" data-i18n-label="sqrt">√</button>
                <button type="button" class="btn btn-sci" data-key="square" data-i18n-label="square">x²</button>
                <button type="button" class="btn btn-sci" data-key="^" data-i18n-label="power">x<sup>y</sup></button>

                <button type="button" class="btn btn-sci" data-key="(" data-i18n-label="lparen">(</button>
                <button type="button" class="btn btn-sci" data-key=")" data-i18n-label="rparen">)</button>
                <button type="button" class="btn btn-sci" data-key="!" data-i18n-label="fact">n!</button>
                <button type="button" class="btn btn-sci" data-key="inv" data-i18n-label="inv">1/x</button>
                <button type="button" class="btn btn-sci" data-key="e" data-i18n-label="euler">e</button>
            </div>

            <!-- لوحة الأرقام -->
            <div class="keys buttons" dir="ltr">
                <button type="button" class="btn btn-clear" data-key="clear" data-i18n-label="clear">C</button>
                <button type="button" class="btn btn-delete" data-key="del" data-i18n-label="del">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9.5l-5 5M12 9.5l5 5"/></svg>
                </button>
                <button type="button" class="btn btn-operator" data-key="%" data-i18n-label="percent">%</button>
                <button type="button" class="btn btn-operator" data-key="/" data-i18n-label="divide">&divide;</button>

                <button type="button" class="btn" data-key="7" data-digit="7">7</button>
                <button type="button" class="btn" data-key="8" data-digit="8">8</button>
                <button type="button" class="btn" data-key="9" data-digit="9">9</button>
                <button type="button" class="btn btn-operator" data-key="*" data-i18n-label="multiply">&times;</button>

                <button type="button" class="btn" data-key="4" data-digit="4">4</button>
                <button type="button" class="btn" data-key="5" data-digit="5">5</button>
                <button type="button" class="btn" data-key="6" data-digit="6">6</button>
                <button type="button" class="btn btn-operator" data-key="-" data-i18n-label="minus">&minus;</button>

                <button type="button" class="btn" data-key="1" data-digit="1">1</button>
                <button type="button" class="btn" data-key="2" data-digit="2">2</button>
                <button type="button" class="btn" data-key="3" data-digit="3">3</button>
                <button type="button" class="btn btn-operator" data-key="+" data-i18n-label="plus">+</button>

                <button type="button" class="btn btn-operator" data-key="paren" data-i18n-label="paren">( )</button>
                <button type="button" class="btn" data-key="0" data-digit="0">0</button>
                <button type="button" class="btn" data-key="." data-digit="." data-i18n-label="decimal">.</button>
                <button type="button" class="btn btn-equal" data-key="equals" data-i18n-label="equals">=</button>
            </div>

            <!-- سجل العمليات -->
            <aside class="history" id="history-panel" role="region" data-i18n-label="history" hidden>
                <header class="history-head">
                    <h2 data-i18n="history">السجل</h2>
                    <div class="toolbar-group">
                        <button type="button" class="icon-btn" id="btn-history-clear" data-i18n-label="history_clear">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
                        </button>
                        <button type="button" class="icon-btn" id="btn-history-close" data-i18n-label="history_close">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                        </button>
                    </div>
                </header>
                <p class="history-empty" id="history-empty" data-i18n="history_empty">لا توجد عمليات سابقة بعد.</p>
                <ol class="history-list" id="history-list"></ol>
            </aside>

            <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </section>

        <noscript><p class="noscript">هذه الحاسبة تحتاج JavaScript لتعمل. / This calculator needs JavaScript.</p></noscript>
    </main>

    <script src="calc.js"></script>
    <script src="state.js"></script>
    <script src="script.js"></script>
</body>
</html>
